<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>USI — Athlete Management System</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f5f6f8;--pn:#fff;--tx:#14181f;--mu:#5d6675;--bd:#dfe3ea;--ac:#1f5eff;--g:#12a150;--a:#d98a00;--r:#d92d20;--sb:#0f1522;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f18;--pn:#141a27;--tx:#e8ecf3;--mu:#94a0b4;--bd:#243049;--ac:#5b8cff;--sb:#080b12}}
:root[data-theme="dark"]{--bg:#0b0f18;--pn:#141a27;--tx:#e8ecf3;--mu:#94a0b4;--bd:#243049;--ac:#5b8cff;--sb:#080b12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
#app{display:flex;min-height:100vh}nav{width:210px;background:var(--sb);color:#cbd3e1;padding:12px 8px;flex:none;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:15px;margin:4px 8px 14px;color:#fff}nav small{display:block;font-weight:400;color:#8b96ab;font-size:11px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:8px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button:hover{background:#1a2338}nav button.on{background:var(--ac);color:#fff}nav .soon{opacity:.45}
main{flex:1;min-width:0}header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--pn);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
header .sp{flex:1}select,input,textarea{background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;font:inherit;max-width:100%}
.pg{padding:16px;max-width:1200px}h2{margin:0 0 4px;font-size:20px}.mu{color:var(--mu)}.grid{display:grid;gap:12px}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:12px}.card h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu)}
.kpi{cursor:pointer}.kpi b{font-size:26px;display:block}.kpi:hover,tr.r:hover{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 6%,var(--pn))}
button.b{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:6px 11px;cursor:pointer;font:inherit}button.b.s{background:none;color:var(--ac);border:1px solid var(--bd)}button:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;color:#fff}.G{background:var(--g)}.A{background:var(--a)}.R{background:var(--r)}.N{background:var(--mu)}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{cursor:pointer;color:var(--mu);font-size:12px}tr.r{cursor:pointer}.sc{overflow-x:auto}
.ai{border-left:3px solid var(--ac)}.dis{font-size:11px;color:var(--mu);margin-top:6px}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--pn);border-left:1px solid var(--bd);padding:16px;overflow:auto;z-index:20;transform:translateX(100%);transition:transform .2s}#dr.on{transform:none}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:6px;z-index:30;display:none}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.chat{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:8px}.m{padding:8px 10px;border-radius:8px;background:var(--bg);white-space:pre-wrap}.m.u{background:var(--ac);color:#fff;align-self:flex-end}
svg .rg{fill:#8a94a6;fill-opacity:.35;stroke:var(--mu);cursor:pointer}svg .rg:hover{stroke:var(--ac);stroke-width:2}svg .mild{fill:#e8c200;fill-opacity:.8}svg .mod{fill:#ff8a00;fill-opacity:.85}svg .sev{fill:#d92d20;fill-opacity:.9}svg .rec{fill:#12a150;fill-opacity:.7}
.stg{display:flex;gap:4px;flex-wrap:wrap}.stg span{font-size:11px;padding:3px 7px;border-radius:4px;border:1px solid var(--bd)}.stg .d{background:var(--g);color:#fff}.stg .c{background:var(--ac);color:#fff}
@media(max-width:800px){nav{position:fixed;z-index:15;left:-220px;transition:left .2s}nav.on{left:0}#mb{display:inline-block!important}}#mb{display:none}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.sk{background:linear-gradient(90deg,var(--bd),var(--pn),var(--bd));background-size:200%;border-radius:8px;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"><nav id="nv"></nav><main><header id="hd"></header><div class="pg" id="pg"></div></main></div><div id="dr" role="dialog" aria-label="Details"></div><div id="toast"></div>
<script>
const N=[["Arjun Mehta","Football","Striker",24,82,"Coach Rao"],["Kabir Sen","Football","Midfielder",22,58,"Coach Rao"],["Rohan Das","Football","Defender",26,71,"Coach Rao"],["Vikram Nair","Football","GK",28,90,"Coach Rao"],["Ishaan Pillai","Athletics","Sprinter",21,55,"Coach Iyer"],["Neel Shah","Athletics","Hurdles",23,76,"Coach Iyer"],["Dev Malhotra","Athletics","Jumper",25,64,"Coach Iyer"],["Aarav Kulkarni","Hockey","Forward",20,88,"Coach Bose"],["Sameer Joshi","Hockey","Defender",27,49,"Coach Bose"],["Yash Reddy","Boxing","Welter",24,73,"Coach Khan"],["Tanish Verma","Boxing","Feather",22,80,"Coach Khan"],["Om Chatterjee","Swimming","Freestyle",19,67,"Coach Menon"]];
let s=7;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
const SPIKE=[1.22,1.35,1.1,1,1.4,1.05,1.15,1,1.3,1.08,1,1.12],SLEEP=[6.1,5.6,7,8,5.4,7.2,6.5,7.9,5.2,7,7.8,6.8];
const A=N.map((n,i)=>{const L=[];for(let d=0;d<28;d++)L.push(Math.round(420*(.85+.3*rnd())*(d>=21?SPIKE[i]:1)));const ac=L.slice(21).reduce((a,b)=>a+b)/7,ch=L.reduce((a,b)=>a+b)/28;return{id:i,name:n[0],sport:n[1],pos:n[2],age:n[3],ready:n[4],coach:n[5],sleep:SLEEP[i],L,acute:Math.round(ac),chronic:Math.round(ch),acwr:+(ac/ch).toFixed(2),inj:null,status:"Active",last:["Today","Yesterday","2d ago"][i%3]}});
const RS=["Injury","Assessment","Acute Mgmt","Rehabilitation","Strength Testing","Sport-Specific","Partial Return","Full Training","Return to Play"];
const RG={head:[150,40,"ellipse",22,26],neck:[150,72,"rect",14,14],shL:[112,92,"ellipse",16,12],shR:[188,92,"ellipse",16,12],chest:[150,110,"rect",44,44],hipL:[132,172,"ellipse",16,14],hipR:[168,172,"ellipse",16,14],thL:[132,215,"rect",26,54],thR:[168,215,"rect",26,54],knL:[132,260,"ellipse",13,13],knR:[168,260,"ellipse",13,13],clL:[132,300,"rect",20,50],clR:[168,300,"rect",20,50],anL:[132,340,"ellipse",10,9],anR:[168,340,"ellipse",10,9]};
const LBL={head:"Head",neck:"Neck",shL:"Left shoulder",shR:"Right shoulder",chest:"Chest",hipL:"Left hip",hipR:"Right hip",thL:"Left thigh",thR:"Right thigh",knL:"Left knee",knR:"Right knee",clL:"Left calf",clR:"Right calf",anL:"Left ankle",anR:"Right ankle"};
const RTPC=["Pain","ROM","Strength","Functional test","Sport-specific test","Medical clearance","Coach clearance"];
function mk(id,reg,type,sev,stage,pain){A[id].inj={reg,type,sev,stage,pain,date:"2026-09-12",pt:"Dr. Kapoor",rtp:RTPC.map(()=>"Pending"),log:["Injury reported","Assessment completed"]};A[id].status="Injured"}
mk(1,"knR","ACL sprain (grade 1)","Moderate",3,4);mk(8,"thL","Hamstring strain","Mild",6,2);mk(4,"anL","Ankle sprain","Severe",1,7);A[8].status="Recovering";
let S={role:"Performance Director",v:"cc",f:"all",q:"",sort:"name",tasks:[{t:"Review Ishaan Pillai load",o:"Coach Iyer",p:"High",st:"Open"}],chat:[],last:[],mp:8,sel:null,org:"Indian High Performance Centre",season:"2026–27"};
const $=x=>document.querySelector(x),band=r=>r<60?"R":r<75?"A":"G",ab=x=>x>1.5?"R":x>1.3?"A":"G",abl=x=>x>1.5?"High":x>1.3?"Monitor":"Normal";
const risk=a=>{const w=[];if(a.ready<60)w.push("readiness "+a.ready);if(a.acwr>1.3)w.push("ACWR "+a.acwr);if(a.sleep<6)w.push("sleep "+a.sleep+"h");if(a.inj)w.push("injury: "+a.inj.type);return w};
const att=()=>A.filter(a=>risk(a).length&&!(a.inj&&risk(a).length==1));
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2200)}
function addTask(t,o,p){S.tasks.push({t,o:o||"Unassigned",p:p||"Medium",st:"Open"})}
const MODS=[["cc","Command Center"],["ath","Athletes"],["tr","Training & ACWR"],["med","Medical & Injury"],["ai","AI Copilot"],["ss","Sports Science"],["nu","Nutrition"],["as","Assessments & TID"],["an","Analytics & BI"],["ap","Onboarding & Approvals"],["tk","Tasks"]],SOON=[];
const HIDE={Athlete:["ath","tr","med","tk","an","ap"],Nutritionist:["med","tr"],"Operations Manager":["med"]};
function shell(){const h=HIDE[S.role]||[];$("#nv").innerHTML=`<h1>USI<small>Athlete Management System</small></h1>`+MODS.filter(m=>!h.includes(m[0])).map(m=>`<button class="${S.v==m[0]?"on":""}" onclick="go('${m[0]}')">${m[1]}</button>`).join("")+SOON.map(x=>`<button class="soon" onclick="toast('${x}: not in this prototype build')">${x}</button>`).join("");
$("#hd").innerHTML=`<button class="b s" id="mb" onclick="$('#nv').classList.toggle('on')">☰</button><select onchange="S.org=this.value;toast('Organisation: '+this.value)"><option>Indian High Performance Centre</option><option>National Athletics Federation</option></select><select onchange="S.season=this.value;toast('Season '+this.value)"><option>2026–27</option><option>2025–26</option></select><input id="gs" placeholder="Search athletes, injuries, tasks…" oninput="gsearch(this.value)" style="min-width:200px"><span class="sp"></span><button class="b s" aria-label="Notifications" onclick="notif()">🔔 ${NT.filter(n=>!n.r).length}</button><button class="b s" onclick="go('ai')">✦ Copilot</button><select onchange="S.role=this.value;if((HIDE[S.role]||[]).includes(S.v))S.v='cc';draw()">${["Performance Director","Coach","Sports Scientist","Physiotherapist","Nutritionist","Federation Admin","Operations Manager","Athlete"].map(r=>`<option ${r==S.role?"selected":""}>${r}</option>`).join("")}</select>`}
function gsearch(q){if(!q){$("#gsr")?.remove();return}const r=[...A.filter(a=>a.name.toLowerCase().includes(q.toLowerCase())).map(a=>[a.name,()=>openA(a.id)]),...A.filter(a=>a.inj&&(a.inj.type+a.name).toLowerCase().includes(q.toLowerCase())).map(a=>["Injury: "+a.inj.type+" — "+a.name,()=>{go("med");S.sel=a.id;draw()}]),...S.tasks.filter(t=>t.t.toLowerCase().includes(q.toLowerCase())).map(t=>["Task: "+t.t,()=>go("tk")])];window._r=r;$("#gsr")?.remove();const d=document.createElement("div");d.id="gsr";d.className="card";d.style.cssText="position:absolute;top:50px;left:60px;z-index:9;min-width:260px";d.innerHTML=r.length?r.slice(0,8).map((x,i)=>`<div style="padding:4px;cursor:pointer" onclick="_r[${i}][1]();$('#gsr').remove()">${x[0]}</div>`).join(""):"<span class=mu>No results</span>";$("#hd").appendChild(d)}
function go(v){S.v=v;$("#nv").classList.remove("on");closeD();draw()}
function drawer(h){$("#dr").innerHTML=`<button class="b s" onclick="closeD()" style="float:right">✕</button>`+h;$("#dr").classList.add("on")}function closeD(){$("#dr").classList.remove("on")}
function openA(id){const a=A[id];S.v="ath";drawer(prof(a))}
function prof(a){const comp=[["Sleep",Math.min(100,a.sleep*12.5)],["Load",Math.max(0,100-(a.acwr-.8)*100)],["Wellness",a.ready+3],["Fatigue",a.ready-4]];const why=a.ready<60?`Readiness ${a.ready} is below threshold, driven by ${a.sleep<6?"short sleep ("+a.sleep+"h) and ":""}a recent workload rise (ACWR ${a.acwr}).`:`Readiness ${a.ready} is stable; ${a.acwr>1.3?"but ACWR "+a.acwr+" warrants monitoring.":"load is within normal range."}`;
return`<h2>${a.name}</h2><div class="mu">${a.sport} · ${a.pos} · ${a.age}y · ${a.coach}</div><p><span class="pill ${band(a.ready)}">Readiness ${a.ready}</span> <span class="pill ${ab(a.acwr)}">ACWR ${a.acwr}</span> <span class="pill N">${a.status}</span></p>${comp.map(c=>`<div>${c[0]} <span class=mu>${Math.round(c[1])}</span><div class="bar"><i style="width:${Math.min(100,c[1])}%;background:var(--${band(c[1])[0].toLowerCase()})"></i></div></div>`).join("")}
<div class="card ai" style="margin-top:12px"><h3>✦ AI insight</h3>${why}<div class="dis">Decision-support signal — review by qualified staff.</div></div><p>28-day load</p>${spark(a.L)}<p style="display:flex;gap:6px;flex-wrap:wrap"><button class="b" onclick="addTask('Recovery plan — ${a.name}','${a.coach}','High');toast('Recovery task created')">Create recovery task</button><button class="b s" onclick="S.chat.push({u:1,t:'Why is ${a.name} at risk?'});ask('Why is ${a.name} at risk?');go('ai')">Ask AI</button>${a.inj?`<button class="b s" onclick="S.sel=${a.id};go('med')">Medical</button>`:""}</p>`}
function spark(L){const m=Math.max(...L),w=380,h=60;return`<svg viewBox="0 0 ${w} ${h}" width="100%">${L.map((v,i)=>`<rect x="${i*13.5}" y="${h-v/m*h}" width="11" height="${v/m*h}" fill="${i>=21?"var(--ac)":"var(--mu)"}" opacity="${i>=21?1:.5}"><title>Day ${i+1}: ${v}</title></rect>`).join("")}</svg><div class="mu" style="font-size:11px">Blue = acute window (7d)</div>`}
function list(title,arr){drawer(`<h2>${title}</h2>`+(arr.length?arr.map(a=>`<div class="card" style="margin:8px 0;cursor:pointer" onclick="openA(${a.id})"><b>${a.name}</b> <span class="pill ${band(a.ready)}">${a.ready}</span><div class="mu">${risk(a).join(" · ")||a.sport}</div></div>`).join(""):"<p class=mu>No records.</p>"))}
function cc(){const rd=b=>A.filter(a=>band(a.ready)==b),r=att();const K=[["Active Athletes",A.length,A],["Ready Today",rd("G").length,rd("G")],["At Risk",r.length,r],["Injured",A.filter(a=>a.inj).length,A.filter(a=>a.inj)],["Training Today",A.filter(a=>a.id%2==0).length,A.filter(a=>a.id%2==0)],["Recovery Compliance","78%",A.filter(a=>a.sleep<6)]];
const hi=A.filter(a=>a.acwr>1.3),lr=A.filter(a=>a.ready<60);
return`<h2>Good morning, ${S.role}</h2><div class="mu">${new Date().toDateString()} · ${S.org} · ${S.season}</div>
<div class="card ai" style="margin:12px 0"><h3>✦ AI Performance Brief</h3><b>${r.length} athletes require attention today.</b> ${hi.length} show elevated workload risk, ${lr.length} have low readiness, ${A.filter(a=>a.inj&&a.inj.stage>=5).length} in late-stage rehab, ${A.filter(a=>a.sleep<6).length} short-sleep flags.<p><button class="b" onclick="S.f='risk';go('ath')">View affected athletes</button> <button class="b s" onclick="r=att();r.forEach(a=>addTask('Review '+a.name,a.coach,'High'));toast(r.length+' tasks created')">Create tasks</button> <button class="b s" onclick="ask('Explain today brief');go('ai')">Explain</button></p><div class="dis">AI-generated insights are decision-support signals and should be reviewed by qualified medical/performance staff.</div></div>
<div class="grid k">${K.map((k,i)=>`<div class="card kpi" onclick="list('${k[0]}',KL[${i}])"><span class=mu>${k[0]}</span><b>${k[1]}</b></div>`).join("")}</div>
<div class="grid two" style="margin-top:12px"><div class="card"><h3>Readiness — click to filter</h3>${[["G","Ready ≥75"],["A","Monitor 60–74"],["R","Low <60"]].map(x=>`<div class="kpi card" style="margin-bottom:6px" onclick="S.f='${x[0]}';go('ath')"><span class="pill ${x[0]}">${x[1]}</span> <b style="display:inline;font-size:18px">${rd(x[0]).length}</b><div class="bar"><i class="${x[0]}" style="width:${rd(x[0]).length/A.length*100}%"></i></div></div>`).join("")}</div>
<div class="card"><h3>Injury alerts</h3>${A.filter(a=>a.inj).map(a=>`<div style="padding:6px 0;border-bottom:1px solid var(--bd);cursor:pointer" onclick="S.sel=${a.id};go('med')"><b>${a.name}</b> — ${a.inj.type} <span class="pill ${a.inj.sev=="Severe"?"R":a.inj.sev=="Moderate"?"A":"N"}">${a.inj.sev}</span><div class="mu">${RS[a.inj.stage]} · ${a.inj.pt}</div></div>`).join("")}</div></div>
<div class="card" style="margin-top:12px"><h3>AI recommendations</h3>${hi.map(a=>`<div style="display:flex;gap:8px;align-items:center;padding:5px 0;flex-wrap:wrap"><span style="flex:1">${a.name}: ACWR ${a.acwr} after load rise — consider reducing intensity.</span><button class="b s" onclick="openA(${a.id})">Review</button><button class="b s" onclick="addTask('Adjust load — ${a.name}','${a.coach}','High');toast('Task created')">Create task</button></div>`).join("")}</div>`}
let KL=[];
function ath(){let r=A.filter(a=>(S.f=="all"||(S.f=="risk"?att().includes(a):S.f=="inj"?a.inj:band(a.ready)==S.f))&&a.name.toLowerCase().includes(S.q.toLowerCase()));r.sort((x,y)=>S.sort=="name"?x.name.localeCompare(y.name):x[S.sort]-y[S.sort]);
return`<h2>Athletes</h2><p><input placeholder="Filter by name" value="${S.q}" oninput="S.q=this.value;draw();$('#pg input').focus()"> <select onchange="S.f=this.value;draw()">${[["all","All"],["risk","Needs attention"],["G","Ready"],["A","Monitor"],["R","Low readiness"],["inj","Injured"]].map(o=>`<option value="${o[0]}" ${S.f==o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></p>
<div class="card sc"><table><tr><th onclick="S.sort='name';draw()">Athlete</th><th>Sport</th><th onclick="S.sort='age';draw()">Age</th><th>Status</th><th onclick="S.sort='ready';draw()">Readiness</th><th onclick="S.sort='acwr';draw()">ACWR</th><th>Last</th><th>Coach</th></tr>${r.map(a=>`<tr class="r" onclick="openA(${a.id})"><td><b>${a.name}</b></td><td>${a.sport}</td><td>${a.age}</td><td>${a.status}</td><td><span class="pill ${band(a.ready)}">${a.ready}</span></td><td><span class="pill ${ab(a.acwr)}">${a.acwr}</span></td><td>${a.last}</td><td>${a.coach}</td></tr>`).join("")||"<tr><td>No athletes match.</td></tr>"}</table></div>`}
function tr(){const id=S.tid??0,a=A[id];return`<h2>Training & ACWR</h2><p><select onchange="S.tid=+this.value;draw()">${A.map(x=>`<option value="${x.id}" ${x.id==id?"selected":""}>${x.name}</option>`).join("")}</select></p>
<div class="grid two"><div class="card"><h3>Workload (click ACWR for calculation)</h3><div class="grid k"><div class="card">Acute (7d)<b style="display:block;font-size:22px">${a.acute}</b></div><div class="card">Chronic (28d)<b style="display:block;font-size:22px">${a.chronic}</b></div><div class="card kpi" onclick="drawer('<h2>ACWR calculation</h2><p>Acute = mean of last 7 daily loads (RPE × minutes) = <b>${a.acute}</b></p><p>Chronic = mean of last 28 days = <b>${a.chronic}</b></p><p>ACWR = ${a.acute} ÷ ${a.chronic} = <b>${a.acwr}</b></p><p>Zones: &lt;1.3 Normal · 1.3–1.5 Monitor · &gt;1.5 High</p>')">ACWR<b style="display:block;font-size:22px"><span class="pill ${ab(a.acwr)}">${a.acwr} ${abl(a.acwr)}</span></b></div></div>${spark(a.L)}</div>
<div class="card ai"><h3>✦ Session recommendation</h3>${a.acwr>1.3?`Load is ${Math.round((a.acwr-1)*100)}% above chronic baseline. Cap high-intensity volume and swap to technical work for 48h.`:"Load is in the normal zone; planned session can proceed."}<p><button class="b" onclick="addTask('Adjust session — ${a.name}','${a.coach}','High');toast('Task created')">Create task</button></p><div class="dis">Decision-support signal only.</div></div></div>
<div class="card" style="margin-top:12px"><h3>Session builder & attendance</h3><input id="sn" placeholder="Session name"> <select id="sd">${["Low","Medium","High"].map(x=>`<option>${x}</option>`)}</select> <input id="sr" type="number" min="1" max="10" placeholder="RPE" style="width:80px"> <input id="sm" type="number" placeholder="Minutes" style="width:90px"> <button class="b" onclick="saveS()">Save & assign to ${a.name}</button><div id="sl" class="mu" style="margin-top:8px">${(S.sess||[]).map(x=>x+"<br>").join("")}</div></div>`}

function docAct(id,i,st){if(!g("docs"))return;dc(id)[i].st=st;log(`${st} ${dc(id)[i].t} document — ${A[id].name}`);if(st=="Rejected")NT.unshift({c:"Compliance",t:"Replacement requested: "+dc(id)[i].t+" — "+A[id].name,v:"ath",r:0});toast("Document "+st.toLowerCase());draw();drawer(prof(A[id]))}
function xtra(a){const D=dc(a.id);return`<h3 style="margin-top:14px">Tags</h3>${(TG[a.id]||[]).map(t=>`<span class="pill N" style="margin-right:4px">${t}</span>`).join("")||"<span class=mu>none</span>"} <button class="b s" onclick="tagM(${a.id})">+ Tag</button><h3 style="margin-top:14px">Documents</h3>${D.map((d,i)=>`<div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:3px 0"><span style="flex:1">${d.t}</span><span class="pill ${d.st=="Verified"?"G":d.st=="Pending"?"A":"R"}">${d.st}</span><button class="b s" aria-label="Verify" onclick="docAct(${a.id},${i},'Verified')">✓</button><button class="b s" onclick="docAct(${a.id},${i},'Rejected')">Request replacement</button><button class="b s" onclick="docAct(${a.id},${i},'Pending')">Upload</button></div>`).join("")}<p><button class="b s" onclick="coachM(${a.id})">Assign coach</button></p>`}
const P0=prof;prof=a=>P0(a)+xtra(a);
function tagM(id){modal(`<h3>Add tag</h3><input id="tg" placeholder="e.g. Talent pathway" style="width:100%"><p><button class="b" onclick="(TG[${id}]=TG[${id}]||[]).push($('#tg').value||'Tag');log('Tagged ${A[id].name}');$('#md').remove();drawer(prof(A[${id}]))">Save</button></p>`)}
function coachM(id){modal(`<h3>Assign coach — ${A[id].name}</h3><select id="cc" style="width:100%">${["Coach Rao","Coach Iyer","Coach Bose","Coach Khan","Coach Menon"].map(c=>`<option ${c==A[id].coach?"selected":""}>${c}</option>`)}</select><p><input id="cr" placeholder="Responsibility" style="width:100%"></p><input id="cd" type="date" value="2026-10-01"><p><button class="b" onclick="if(!g('train')&&!g('docs'))return;A[${id}].coach=$('#cc').value;log('Coach assigned: '+A[${id}].coach+' → ${A[id].name}');$('#md').remove();toast('Coach assigned');draw();drawer(prof(A[${id}]))">Save</button></p>`)}
/* guards + audit on existing actions */
const w=(n,k,f)=>{const o=window[n];window[n]=function(...a){if(k&&!g(k))return;const r=o.apply(this,a);f&&log(f(...a));return r}};
w("adv","med",id=>"Rehab advanced — "+A[id].name);w("rt","med");w("rtp","med",id=>"RTP cleared — "+A[id].name);w("repInj","med",id=>"Injury reported — "+A[id].name);w("saveS","train",()=>"Session assigned");
const Q0=qa;qa=(i,st)=>{if(!g("appr"))return;const f=()=>{Q0(i,st);log(st+" — "+Q[i].n)};st=="Rejected"?confirmM("Reject "+Q[i].n+"? This is recorded in the audit log.",f):f()};
const _at=addTask;addTask=(t,o,p)=>{_at(t,o,p);log("Task created: "+t)};
function au(){return`<h2>Audit Log</h2><p class=mu>Immutable record of role-attributed actions (prototype, in-memory).</p><div class="card">${AUD.map(x=>`<div style="padding:4px 0;border-bottom:1px solid var(--bd)">${x}</div>`).join("")||"<span class=mu>No actions recorded yet. Try approving an athlete or advancing rehab.</span>"}</div>`}
/* training: cycles + exercise library */
const EX=[["Back squat","Strength"],["Nordic hamstring","Injury prevention"],["30m sprints","Speed"],["Yo-Yo IR1","Conditioning"],["Box jump","Power"],["Tempo run","Conditioning"]];
function cyc(){const mc=S.mic||["Low","High","Medium","High","Low","Medium","Rest"],f=S.exf||"All";S.mic=mc;return`<div class="card" style="margin-top:12px"><h3>Periodisation</h3><div class="stg" style="margin-bottom:8px"><span class="c">Macro: Preparation (Jul–Oct)</span><span>Competition (Nov–Mar)</span><span>Transition (Apr)</span></div><div class="stg" style="margin-bottom:8px"><span class="d">Meso 1: Base</span><span class="c">Meso 2: Intensification</span><span>Meso 3: Peak</span><span>Meso 4: Deload</span></div><div style="display:flex;gap:6px;flex-wrap:wrap">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d,i)=>`<div>${d}<br><select onchange="S.mic[${i}]=this.value;log('Microcycle ${d} set to '+this.value);toast('Microcycle updated')">${["Rest","Low","Medium","High"].map(x=>`<option ${x==mc[i]?"selected":""}>${x}</option>`)}</select></div>`).join("")}</div></div>
<div class="card" style="margin-top:12px"><h3>Exercise library</h3><select onchange="S.exf=this.value;draw()">${["All",...new Set(EX.map(e=>e[1]))].map(x=>`<option ${x==f?"selected":""}>${x}</option>`)}</select> ${EX.filter(e=>f=="All"||e[1]==f).map(e=>`<button class="b s" style="margin:2px" onclick="(S.exs=S.exs||[]).push('${e[0]}');toast('${e[0]} added to session');draw()">+ ${e[0]}</button>`).join("")}<div class=mu>Session exercises: ${(S.exs||[]).join(", ")||"none"}</div></div>`}
const T0=tr;tr=()=>T0()+cyc();
/* nav, a11y, persistence, loading */
MODS.push(["au","Audit Log"]);HIDE.Athlete.push("au","ss","nu","as");
const D0=draw;draw=()=>{D0();try{localStorage.setItem("usi",JSON.stringify({t:S.tasks,r:S.role,q:Q}))}catch(e){}};
const VW=window.VIEWS={cc,ath,tr,med,ai:aiv,tk,ss,nu,as:asv,an,ap,au};
function boot(){try{const d=JSON.parse(localStorage.getItem("usi")||"null");if(d){S.tasks=d.t;S.role=d.r;Q=d.q}}catch(e){}shell();$("#pg").innerHTML='<div class="sk" style="height:28px;width:40%"></div><div class="sk" style="height:110px;margin-top:14px"></div><div class="sk" style="height:220px;margin-top:14px"></div>';setTimeout(draw,450)}

/* ===== gap fill: bulk actions, participation, wellness, med notes, attendance/RPE, forecast, copy export ===== */
const SEL=new Set(),gd=a=>a.id%4==3?"F":"M";
function selT(i){SEL.has(i)?SEL.delete(i):SEL.add(i);draw()}function selAll(c){c?A.forEach(a=>SEL.add(a.id)):SEL.clear();draw()}
function bulk(){if(!SEL.size)return"";return`<div class="card ai" style="margin:8px 0"><b>${SEL.size} selected</b> <button class="b s" onclick="if(!g('train')&&!g('docs'))return;SEL.forEach(i=>addTask('Recovery plan — '+A[i].name,A[i].coach,'High'));toast(SEL.size+' tasks created');SEL.clear();draw()">Create recovery tasks</button> <select id="bc"><option>Coach Rao</option><option>Coach Iyer</option><option>Coach Bose</option><option>Coach Khan</option><option>Coach Menon</option></select> <button class="b s" onclick="if(!g('train')&&!g('docs'))return;const c=$('#bc').value;SEL.forEach(i=>A[i].coach=c);log('Bulk coach assign: '+c+' ('+SEL.size+')');toast('Coach assigned to '+SEL.size);SEL.clear();draw()">Assign coach</button> <button class="b s" onclick="SEL.clear();draw()">Clear</button></div>`}
const AT=ath;ath=()=>AT().replace('</table></div>','</table></div>').replace('<th onclick="S.sort=\'name\';draw()">Athlete</th>','<th><input type="checkbox" aria-label="Select all" onchange="selAll(this.checked)"></th><th onclick="S.sort=\'name\';draw()">Athlete</th>').replace(/<tr class="r" onclick="openA\((\d+)\)"><td><b>/g,(m,i)=>`<tr class="r" onclick="openA(${i})"><td onclick="event.stopPropagation()"><input type="checkbox" aria-label="Select" ${SEL.has(+i)?"checked":""} onchange="selT(${i})"></td><td><b>`).replace('<div class="card sc">',bulk()+'<div class="card sc">');
S.pf={sp:"all",g:"all",ag:"all"};
function part(){const p=S.pf,f=A.filter(a=>(p.sp=="all"||a.sport==p.sp)&&(p.g=="all"||gd(a)==p.g)&&(p.ag=="all"||(p.ag=="U23"?a.age<23:a.age>=23))),base=f.length?f.reduce((s,a)=>s+60+(a.id*13)%38,0)/f.length:0,W=[0,1,2,3,4,5].map(w=>f.length?Math.max(0,Math.min(100,Math.round(base+(w-2)*2-(w%3)*3))):0);
const sel=(k,o)=>`<select aria-label="${k}" onchange="S.pf.${k}=this.value;draw()">${o.map(x=>`<option ${x==p[k]?"selected":""}>${x}</option>`)}</select>`;
return`<div class="card" style="margin-top:12px"><h3>Participation analytics</h3><p>${sel("sp",["all","Football","Athletics","Hockey","Boxing","Swimming"])} ${sel("g",["all","M","F"])} ${sel("ag",["all","U23","23+"])} <span class=mu>${f.length} athletes · click a bar for records</span></p>${f.length?`<svg viewBox="0 0 380 110" width="100%">${W.map((v,i)=>`<g style="cursor:pointer" onclick="list('Participation W${i+1}: ${v}%',KLp)"><rect x="${i*62+6}" y="${100-v}" width="48" height="${v}" fill="var(--ac)" rx="4"><title>Week ${i+1}: ${v}%</title></rect><text x="${i*62+30}" y="${95-v}" text-anchor="middle" font-size="11" fill="var(--tx)">${v}%</text><text x="${i*62+30}" y="108" text-anchor="middle" font-size="10" fill="var(--mu)">W${i+1}</text></g>`).join("")}</svg>`:"<span class=mu>No athletes match these filters.</span>"}</div>`}
let KLp=A;const CC=cc;cc=()=>{const p=S.pf;KLp=A.filter(a=>(p.sp=="all"||a.sport==p.sp)&&(p.g=="all"||gd(a)==p.g)&&(p.ag=="all"||(p.ag=="U23"?a.age<23:a.age>=23)));return CC()+part()};
const WL=[],MN=[];
function well(id){const a=A[id],h=WL[id]||[],ok=PM.med.includes(S.role)||S.role=="Coach"||S.role=="Sports Scientist";return`<div class="card" style="margin-top:12px"><h3>Wellness monitoring — ${a.name}</h3><p>Sleep h <input id="ws" type="number" step=".5" value="${a.sleep}" style="width:70px"> Soreness 1–5 <input id="wo" type="number" min="1" max="5" value="2" style="width:60px"> Mood 1–5 <input id="wm" type="number" min="1" max="5" value="3" style="width:60px"> <button class="b" onclick="wsave(${id})">Log check-in</button></p>${h.length?h.slice(-5).reverse().map(r=>`<div class=mu>${r.d} · sleep ${r.s}h · soreness ${r.o} · mood ${r.m} · score ${r.sc}</div>`).join(""):"<span class=mu>No check-ins yet. Missing data is flagged in AI briefs.</span>"}</div>
<div class="card" style="margin-top:12px"><h3>Medical notes</h3>${PM.med.includes(S.role)?`${(MN[id]||[]).map(n=>`<div style="padding:4px 0;border-bottom:1px solid var(--bd)">${n.t}<div class=mu style="font-size:12px">${n.w} · ${n.d}</div></div>`).join("")||"<span class=mu>No notes.</span>"}<p><input id="mn" placeholder="Add clinical note" style="width:70%"> <button class="b" onclick="mnote(${id})">Add</button></p>`:`<span class=mu>🔒 Clinical notes are restricted to medical staff. ${a.name} is ${a.inj?"modified availability":"available"}.</span>`}</div>`}
function wsave(id){const a=A[id],s=+$("#ws").value||7,o=+$("#wo").value||2,m=+$("#wm").value||3,sc=Math.round((s*8+(6-o)*6+m*6)/1.24);(WL[id]=WL[id]||[]).push({d:new Date().toLocaleTimeString(),s,o,m,sc});a.sleep=s;a.ready=Math.round(a.ready*.7+sc*.3);if(sc<60)NT.unshift({c:"Readiness",t:a.name+" wellness check-in low ("+sc+")",v:"med",r:0});log("Wellness logged — "+a.name);toast("Check-in logged; readiness now "+a.ready);draw()}
function mnote(id){if(!g("med"))return;(MN[id]=MN[id]||[]).push({t:$("#mn").value||"Note",w:S.role,d:new Date().toLocaleTimeString()});log("Medical note added — "+A[id].name);draw()}
const MD=med;med=()=>MD()+well(S.sel??1);
S.att={};S.adj=0;
function attn(){const a0=A[S.tid??0],sq=A.filter(a=>a.sport==a0.sport),pr=sq.filter(a=>(S.att[a.id]?.p??1)),miss=pr.filter(a=>!S.att[a.id]?.rpe),rp=pr.filter(a=>S.att[a.id]?.rpe);
return`<div class="card" style="margin-top:12px"><h3>Session detail — ${a0.sport}: attendance & RPE</h3><p>Duration <input id="ad" type="number" value="60" style="width:70px"> min · Intensity <select id="ai2"><option>Medium</option><option>High</option><option>Low</option></select> · Adjust workload <select id="aj">${[-20,-10,0,10].map(x=>`<option value="${x}" ${x==S.adj?"selected":""}>${x>0?"+":""}${x}%</option>`)}</select></p><div class="sc"><table><tr><th>Athlete</th><th>Present</th><th>RPE (1–10)</th></tr>${sq.map(a=>`<tr><td>${a.name}</td><td><input type="checkbox" ${(S.att[a.id]?.p??1)?"checked":""} onchange="(S.att[${a.id}]=S.att[${a.id}]||{}).p=this.checked?1:0;draw()"></td><td><input type="number" min="1" max="10" style="width:70px" value="${S.att[a.id]?.rpe||""}" onchange="(S.att[${a.id}]=S.att[${a.id}]||{p:1}).rpe=+this.value"></td></tr>`).join("")}</table></div><p>Completion ${Math.round(pr.length/sq.length*100)}% · avg RPE ${rp.length?(rp.reduce((s,a)=>s+S.att[a.id].rpe,0)/rp.length).toFixed(1):"—"} ${miss.length?`<span class="pill A">${miss.length} missing RPE</span>`:""}</p><button class="b" onclick="satt()">Save session & recalculate ACWR</button></div>`}
function satt(){const a0=A[S.tid??0],d=+$("#ad").value||60,j=+$("#aj").value;S.adj=j;let n=0;A.filter(a=>a.sport==a0.sport&&(S.att[a.id]?.p??1)&&S.att[a.id]?.rpe).forEach(a=>{a.L.shift();a.L.push(Math.round(S.att[a.id].rpe*d*(1+j/100)));a.acute=Math.round(a.L.slice(21).reduce((x,y)=>x+y)/7);a.chronic=Math.round(a.L.reduce((x,y)=>x+y)/28);a.acwr=+(a.acute/a.chronic).toFixed(2);a.last="Today";n++});log("Attendance & RPE saved ("+n+" athletes)");toast(n+" athletes updated; ACWR recalculated")}
w("satt","train");const TRp=tr;tr=()=>TRp()+attn();
function fc(){const rows=[...new Set(A.map(a=>a.sport))].map(s=>{const g=A.filter(a=>a.sport==s),r=g.reduce((x,a)=>x+a.ready,0)/g.length,c=g.reduce((x,a)=>x+a.acwr,0)/g.length,d=Math.round((r>70?0:2)-(c-1)*18+(g.reduce((x,a)=>x+(a.sleep-7),0)/g.length)*2);return[s,Math.round(r),Math.round(r+d),d,c]});
return`<div class="card ai" style="margin-top:12px"><h3>✦ Predictive: 7-day readiness forecast</h3><table><tr><th>Sport</th><th>Now</th><th>Forecast</th><th>Driver</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><span class="pill ${band(r[2])}">${r[2]}</span> ${r[3]>0?"▲":r[3]<0?"▼":"–"}</td><td class=mu>${r[4]>1.3?"elevated ACWR":"load stable"}${r[3]<0?", sleep/load trend":""}</td></tr>`).join("")}</table><div class="dis">Demo model (load and sleep trend), not a validated prediction.</div></div>`}
const ANp=an;an=()=>ANp()+((S.path||[]).length?"":fc());
const C0=csv;csv=()=>{C0();$("#dr").insertAdjacentHTML("beforeend",'<p><button class="b" onclick="cpy()">Copy CSV to clipboard</button></p>')};
function cpy(){const t=$("#dr textarea").value;try{navigator.clipboard.writeText(t).then(()=>toast("Copied"),()=>{$("#dr textarea").select();toast("Press Ctrl/Cmd+C to copy")})}catch(e){$("#dr textarea").select();toast("Press Ctrl/Cmd+C to copy")}}
Object.assign(window.VIEWS,{cc,ath,tr,med,an});

boot();
</script></body></html>
